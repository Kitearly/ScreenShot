name = "screenshot"
main = "src/index.ts"
compatibility_date = "2026-10-20"
workers_dev = true

# Browser Run 绑定：无需 API Token，也无需 Account ID。
# 调用方式见 src/shot.ts —— env.BROWSER.quickAction("screenshot", …)
[browser]
binding = "BROWSER"

# Workers KV 命名空间：持久化截图二进制与元数据。
# 创建：npx wrangler kv namespace create SHOTS
[[kv_namespaces]]
binding = "SHOTS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_NAMESPACE_ID"

# Workers Cache：分层缓存 + 并发请求合并 + stale-while-revalidate。
[cache]
enabled = true

# 网关入口不缓存（每次请求都要做白名单校验与 URL 规范化）。
[exports.default]
type = "worker"
[exports.default.cache]
enabled = false

# 真正出图的那一层才进缓存。
[exports.Shot]
type = "worker"
[exports.Shot.cache]
enabled = true
